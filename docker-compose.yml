# 가상 데이터 SQL Server (synthetic_data/ 로 생성)
services:
  mes-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ask-mes-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mes-db-data:/var/opt/mssql

volumes:
  mes-db-data:
